# Railway deployment (https://railway.app).
#
# Builds the same image as server/Dockerfile: the API plus the web app, served
# from one address. In the Railway service you still need to:
#   1. Add a Volume mounted at /var/lib/venvo-pos  (the database and cheque
#      photos live here; without it every redeploy starts with an empty shop).
#   2. Add the variable RAILWAY_RUN_UID=0, so the server can write to the
#      volume (Railway mounts volumes as root).
#   3. Settings -> Networking -> Generate Domain, target port 8080.
# Optional: WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID for cheque reminders.

[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"

[deploy]
healthcheckPath = "/api/v1/status"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
